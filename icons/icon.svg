<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Квантовый ежедневник">
  <!-- Значок: обсидиан и золото, те же, что в «Игре мудрецов».
       Раскрытый ежедневник, на развороте цветок жизни, поверх — орбита
       электрона. Сакральная геометрия и квант на одной обложке.
       Без текста: на значке приложения подпись всё равно не читается. -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F9D976"/>
      <stop offset="30%" stop-color="#EAA82C"/>
      <stop offset="60%" stop-color="#C18825"/>
      <stop offset="85%" stop-color="#7A4B11"/>
      <stop offset="100%" stop-color="#B88428"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#C9A34E" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#C9A34E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="#0b0a0f"/>
  <rect width="512" height="512" fill="url(#halo)"/>

  <!-- Разворот: корешок по центру, две страницы -->
  <g stroke="url(#gold)" fill="none" stroke-width="11" stroke-linejoin="round" stroke-linecap="round">
    <path d="M256 152c-34-23-74-31-116-26-10 1-18 9-18 19v178c0 11 10 20 21 18 38-5 76 3 113 23"/>
    <path d="M256 152c34-23 74-31 116-26 10 1 18 9 18 19v178c0 11-10 20-21 18-38-5-76 3-113 23"/>
    <path d="M256 152v212"/>
  </g>

  <!-- Цветок жизни: центральный круг и шесть по кольцу -->
  <g stroke="url(#gold)" fill="none" stroke-width="6" opacity=".9">
    <circle cx="256" cy="248" r="33"/>
    <circle cx="256" cy="215" r="33"/>
    <circle cx="256" cy="281" r="33"/>
    <circle cx="285" cy="232" r="33"/>
    <circle cx="285" cy="265" r="33"/>
    <circle cx="227" cy="232" r="33"/>
    <circle cx="227" cy="265" r="33"/>
  </g>

  <!-- Орбита электрона поверх геометрии -->
  <ellipse cx="256" cy="248" rx="98" ry="38" transform="rotate(-28 256 248)"
           fill="none" stroke="#F6C147" stroke-width="5" opacity=".75"/>
  <circle cx="338" cy="207" r="11" fill="#FFF2B2"/>
</svg>
